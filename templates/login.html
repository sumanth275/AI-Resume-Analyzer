{% extends "base.html" %}

{% block title %}Log In | AI Resume Analyzer{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header text-center">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Log in to access your resumes & job match reports</p>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" value="{{ email if email else '' }}" placeholder="name@example.com" required class="form-control">
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required class="form-control">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-right-to-bracket"></i> Log In
            </button>
        </form>

        <div class="auth-footer text-center">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create an Account</a></p>
        </div>
    </div>
</div>
{% endblock %}
